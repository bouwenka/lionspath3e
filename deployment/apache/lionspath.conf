# LionPath 3E secure Apache configuration
# Required modules:
#   ssl headers alias log_config socache_shmcb
#
# This file intentionally grants embedded services only the browser capabilities
# LionPath currently uses. Review the certificate paths before activation.

ServerTokens Prod
ServerSignature Off
TraceEnable Off

SSLSessionCache "shmcb:/var/run/apache2/lionspath_ssl_scache(512000)"
SSLSessionCacheTimeout 300
SSLStaplingCache "shmcb:/var/run/apache2/lionspath_ocsp_cache(128000)"

<VirtualHost *:80>
    ServerName lionspath.lcps.k12.va.us

    Redirect permanent / https://lionspath.lcps.k12.va.us/

    ErrorLog ${APACHE_LOG_DIR}/lionspath_redirect_error.log
    CustomLog ${APACHE_LOG_DIR}/lionspath_redirect_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName lionspath.lcps.k12.va.us
    DocumentRoot /var/www/lionspath
    DirectoryIndex index.html

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/lionspath/wildcard.crt
    SSLCertificateKeyFile /etc/apache2/ssl/lionspath/wildcard.key
    SSLCertificateChainFile /etc/apache2/ssl/lionspath/wildcard.ca-bundle.crt

    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder on
    SSLCompression off
    SSLSessionTickets off

    SSLUseStapling on
    SSLStaplingResponderTimeout 5
    SSLStaplingReturnResponderErrors off

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "0"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Permitted-Cross-Domain-Policies "none"
    Header always set Cross-Origin-Opener-Policy "same-origin-allow-popups"

    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; frame-src https://drive.google.com https://student.schoolai.com https://knowt.com https://www.knowt.com; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'; manifest-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; upgrade-insecure-requests"
    Header always set Permissions-Policy "geolocation=(), payment=(), usb=(), serial=(), hid=(), accelerometer=(), gyroscope=(), magnetometer=(), microphone=(self \"https://student.schoolai.com\" \"https://knowt.com\" \"https://www.knowt.com\"), camera=(self \"https://student.schoolai.com\" \"https://knowt.com\" \"https://www.knowt.com\"), autoplay=(self \"https://drive.google.com\" \"https://knowt.com\" \"https://www.knowt.com\"), fullscreen=(self \"https://drive.google.com\" \"https://student.schoolai.com\" \"https://knowt.com\" \"https://www.knowt.com\"), clipboard-read=(self \"https://student.schoolai.com\" \"https://knowt.com\" \"https://www.knowt.com\"), clipboard-write=(self \"https://student.schoolai.com\" \"https://knowt.com\" \"https://www.knowt.com\"), speaker-selection=(self \"https://knowt.com\" \"https://www.knowt.com\")"

    <Directory /var/www/lionspath>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        <LimitExcept GET HEAD OPTIONS>
            Require all denied
        </LimitExcept>
    </Directory>

    <FilesMatch "(?i)(^\.|\.env$|\.git$|\.htaccess$|\.(zip|bak|tmp|swp|sql|log|ini|conf|md|pem|key|p12|pfx|crt|csr|ya?ml|toml|lock|ps1|sh|py)$)">
        Require all denied
    </FilesMatch>

    RedirectMatch 404 "(?i)(^|/)(\.git|\.svn|\.hg|\.site-backups|\.agents|\.codex|tmp|deployment|codex-lionspath-v2-phase1)(/|$)"

    ErrorLog ${APACHE_LOG_DIR}/lionspath_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/lionspath_ssl_access.log combined
</VirtualHost>
